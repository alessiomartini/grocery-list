name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compute version from run number
        run: |
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dispensa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every push to a branch (not PRs) republishes the single "latest" release, overwriting
      # its assets - no manual tag/version bump needed to ship an update. The app compares
      # BuildConfig.VERSION_CODE against version.txt to decide whether an update is available.
      - name: Prepare release assets
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dispensa-latest.apk
          printf '%s' "${{ env.APP_VERSION_CODE }}" > version.txt

      - name: Publish latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (v${{ env.APP_VERSION_NAME }})"
          body: "Automatically published from commit ${{ github.sha }}."
          files: |
            dispensa-latest.apk
            version.txt
