name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node:sqlite (usato dal finto D1) richiede Node 22.5+.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test del Worker
        working-directory: backend
        run: npm test
