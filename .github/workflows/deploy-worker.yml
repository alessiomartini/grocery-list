name: Deploy Worker

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Il deploy si puo' fare anche a mano con `npx wrangler deploy`. Se i secret non ci
      # sono, saltiamo invece di fallire: un workflow rosso a ogni push direbbe che qualcosa
      # e' rotto, mentre qui manca solo una configurazione facoltativa.
      - name: Verifica i secret Cloudflare
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret Cloudflare non configurati: deploy automatico saltato."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Il token di sincronizzazione viene ricaricato come secret del Worker a ogni deploy,
      # cosi' l'unica copia da tenere aggiornata e' quella nei secret di GitHub.
      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          secrets: |
            SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.PANTRY_SYNC_TOKEN }}
