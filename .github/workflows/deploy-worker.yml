name: Deploy Worker

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Il deploy si puo' fare anche a mano con `npx wrangler deploy`. Se i secret non ci
      # sono, saltiamo invece di fallire: un workflow rosso a ogni push direbbe che qualcosa
      # e' rotto, mentre qui manca solo una configurazione facoltativa.
      # Servono tutti e tre: con una configurazione parziale il deploy fallirebbe a meta',
      # ed e' esattamente il caso in cui non si capisce cosa manca.
      - name: Verifica i secret Cloudflare
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_TOKEN: ${{ secrets.PANTRY_SYNC_TOKEN }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$SYNC_TOKEN" ] && missing="$missing PANTRY_SYNC_TOKEN"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy automatico saltato, secret mancanti:$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Il token di sincronizzazione viene ricaricato come secret del Worker a ogni deploy,
      # cosi' l'unica copia da tenere aggiornata e' quella nei secret di GitHub.
      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          # Senza questo l'action installa wrangler 3.x, mentre un deploy manuale usa la 4.x.
          wranglerVersion: '4.130.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          secrets: |
            SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.PANTRY_SYNC_TOKEN }}
